name: Release

# Every push to main runs CI. When the version in the plugin manifest has no
# tag yet, the run then tags that commit `v<version>` and publishes a GitHub
# release with the standalone CLI, the skill zip and their checksums. A merge
# that leaves the version alone publishes nothing.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the manifest and look for its tag
        id: read
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugins/semanticly/.claude-plugin/plugin.json"))["version"])')"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            release=false
            echo "::notice::$tag already exists, so this push publishes nothing."
          else
            release=true
            echo "::notice::$tag does not exist yet, so this push publishes it."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the release
    needs: [version, ci]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Verify the checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Tag the commit and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "$TAG" \
            dist/semanticly dist/semanticly-skill.zip dist/SHA256SUMS \
            --target "$COMMIT" --title "$TAG" --generate-notes
