name: Release

# Pushing a tag `v<version>` publishes a GitHub release with the standalone
# CLI, the skill zip and their checksums. The tag must name the version in
# the plugin manifest.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag with the manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugins/semanticly/.claude-plugin/plugin.json"))["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG, but plugin.json says version $version, so the tag should be v$version."
            exit 1
          fi

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Verify the checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/semanticly dist/semanticly-skill.zip dist/SHA256SUMS \
            --title "$TAG" --generate-notes --verify-tag
